services:
  db:
    image: postgis/postgis:16-3.4
    container_name: citybuddy-postgres
    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "5433:5432"

    volumes:
      - citybuddy_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  citybuddy_postgres_data: